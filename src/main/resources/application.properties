spring.application.name=bus-ticket-management-v2
spring.profiles.default=local

# MySQL Database Configuration (used when profile 'mysql' or custom DB_URL is provided)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bus_ticket_v2?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server & Thymeleaf Configuration
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Application Business Settings
app.seat-hold.timeout-minutes=10
app.timezone=Asia/Ho_Chi_Minh
app.bootstrap.admin.username=${ADMIN_USERNAME:admin}
app.bootstrap.admin.email=${ADMIN_EMAIL:admin@busbooking.vn}
app.bootstrap.sample-data=${SEED_SAMPLE_DATA:true}
