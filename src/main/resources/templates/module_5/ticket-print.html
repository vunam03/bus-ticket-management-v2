<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('In vé xe ' + ${ticket.ticketCode})}"></head>
<body class="bg-white py-4">
<div class="container" style="max-width: 780px;">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <a th:href="@{/tickets/{id}(id=${ticket.id})}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Quay lại chi tiết vé
        </a>
        <button type="button" onclick="window.print()" class="btn btn-primary">
            <i class="bi bi-printer-fill me-1"></i>In vé ngay (Ctrl + P)
        </button>
    </div>

    <div class="border border-2 border-dark rounded-3 p-4">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
            <div>
                <h4 class="fw-bold mb-0">BUSBOOKING VN - VÉ XE KHÁCH ĐIỆN TỬ</h4>
                <small class="text-muted" th:text="${ticket.busTrip.busCompany.companyName + ' • Hotline: ' + ticket.busTrip.busCompany.hotline}"></small>
            </div>
            <div class="text-end">
                <div class="small text-muted">MÃ VÉ</div>
                <div class="fs-5 fw-bold font-monospace" th:text="${ticket.ticketCode}"></div>
            </div>
        </div>

        <div class="row g-3 align-items-center">
            <div class="col-8">
                <p class="mb-2"><strong>Tuyến đường:</strong> <span th:text="${ticket.busTrip.departureProvince + ' → ' + ticket.busTrip.arrivalProvince}"></span></p>
                <p class="mb-2"><strong>Giờ xuất bến:</strong> <span th:text="${#temporals.format(ticket.busTrip.departureTime, 'HH:mm - dd/MM/yyyy')}"></span></p>
                <p class="mb-2"><strong>Bến đón khách:</strong> <span th:text="${ticket.busTrip.departureStation}"></span></p>
                <p class="mb-2"><strong>Bến trả khách:</strong> <span th:text="${ticket.busTrip.arrivalStation}"></span></p>
                <p class="mb-2"><strong>Hành khách:</strong> <span th:text="${ticket.passengerName + ' - SĐT: ' + ticket.passengerPhone}"></span></p>
                <p class="mb-2"><strong>Số ghế:</strong> <strong class="fs-5" th:text="${ticket.seat.seatNumber}"></strong> (Biển số: <span th:text="${ticket.busTrip.licensePlate}"></span>)</p>
                <p class="mb-0"><strong>Giá vé:</strong> <strong th:text="${#numbers.formatDecimal(ticket.finalPrice, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></strong> (<span th:text="${ticket.paymentStatus.displayName}"></span>)</p>
            </div>
            <div class="col-4 text-center">
                <div th:utext="${qrSvg}"></div>
                <small class="text-muted d-block mt-1">Mã QR kiểm soát lên xe</small>
            </div>
        </div>
    </div>
</div>
</body>
</html>
