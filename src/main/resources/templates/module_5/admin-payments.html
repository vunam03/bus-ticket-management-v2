<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments :: head('Quản lý Giao dịch Thanh toán - Admin')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{common/fragments :: navbar}"></nav>

<div class="container-fluid flex-grow-1">
    <div class="row">
        <div class="col-lg-2 px-0">
            <aside th:replace="~{common/fragments :: adminSidebar('payments')}"></aside>
        </div>

        <main class="col-lg-10 py-4 px-4">
            <div th:replace="~{common/fragments :: alerts}"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-credit-card-2-front-fill text-primary me-2"></i>Lịch sử Giao dịch Thanh toán</h3>
                    <p class="text-muted mb-0">Theo dõi toàn bộ giao dịch thanh toán tiền mặt, chuyển khoản, ví điện tử và hoàn tiền</p>
                </div>
                <a th:href="@{/admin/tickets}" class="btn btn-outline-primary">
                    <i class="bi bi-ticket-detailed me-1"></i>Quản lý Danh sách Vé
                </a>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-3">Mã giao dịch</th>
                            <th>Mã vé</th>
                            <th>Khách hàng</th>
                            <th>Phương thức</th>
                            <th>Số tiền</th>
                            <th>Trạng thái</th>
                            <th>Thời gian</th>
                            <th class="pe-3">Ghi chú</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(transactions)}">
                            <td colspan="8" class="text-center py-5 text-muted">Chưa có giao dịch thanh toán nào phát sinh.</td>
                        </tr>
                        <tr th:each="tx : ${transactions}">
                            <td class="ps-3 font-monospace fw-bold" th:text="${tx.transactionCode}">TXN-001</td>
                            <td>
                                <a th:href="@{/tickets/{id}(id=${tx.ticket.id})}" class="font-monospace text-decoration-none fw-semibold"
                                   th:text="${tx.ticket.ticketCode}">TK-001</a>
                            </td>
                            <td th:text="${tx.ticket.passengerName}">Nguyễn Văn A</td>
                            <td><span class="badge bg-light text-dark border" th:text="${tx.paymentMethod.displayName}"></span></td>
                            <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(tx.amount, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${tx.status.name() == 'SUCCESS' ? 'bg-success' : (tx.status.name() == 'REFUNDED' ? 'bg-info text-dark' : (tx.status.name() == 'FAILED' ? 'bg-danger' : 'bg-warning text-dark'))}"
                                      th:text="${tx.status.displayName}"></span>
                            </td>
                            <td class="small text-muted" th:text="${#temporals.format(tx.transactionTime, 'HH:mm dd/MM/yyyy')}"></td>
                            <td class="small text-secondary pe-3" th:text="${tx.notes}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="~{common/fragments :: footer}"></footer>
<div th:replace="~{common/fragments :: scripts(null)}"></div>
</body>
</html>
