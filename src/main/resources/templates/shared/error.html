<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{shared/fragments :: head('Thông báo lỗi')}"></head>
<body>
<nav th:replace="~{shared/fragments :: navbar}"></nav>

<main class="container py-5">
    <div class="card-modern p-5 text-center mx-auto" style="max-width: 600px;">
        <div class="display-3 fw-bold text-danger mb-2" th:text="${statusCode != null ? statusCode : 'Lỗi'}">400</div>
        <h3 class="fw-bold mb-3" th:text="${errorTitle != null ? errorTitle : 'Đã xảy ra lỗi'}">Thông báo</h3>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Yêu cầu của bạn không thể thực hiện.'}"></p>
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-primary px-4"><i class="bi bi-house-door me-1"></i>Về trang chủ</a>
            <a th:if="${isAdmin}" th:href="@{/admin/dashboard}" class="btn btn-warning fw-semibold px-4">
                <i class="bi bi-speedometer2 me-1"></i>Về Dashboard Admin
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{shared/fragments :: footer}"></footer>
</body>
</html>
