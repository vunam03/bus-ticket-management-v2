<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{shared/fragments :: head('Quản lý chuyến xe')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{shared/fragments :: navbar}"></nav>

<div class="container-fluid flex-grow-1">
    <div class="row">
        <div class="col-lg-2 px-0">
            <aside th:replace="~{shared/fragments :: adminSidebar('trips')}"></aside>
        </div>

        <main class="col-lg-10 py-4 px-4">
            <div th:replace="~{shared/fragments :: alerts}"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-bus-front text-primary me-2"></i>Quản Lý Danh Sách Chuyến Xe</h3>
                    <p class="text-muted mb-0">Theo dõi, cập nhật thông tin và điều phối các chuyến xe trong hệ thống</p>
                </div>
                <a th:href="@{/admin/trips/new}" class="btn btn-primary fw-semibold">
                    <i class="bi bi-plus-circle me-1"></i>Thêm Chuyến Xe Mới
                </a>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-3">Mã chuyến</th>
                            <th>Tuyến đường</th>
                            <th>Nhà xe</th>
                            <th>Khởi hành</th>
                            <th>Đến dự kiến</th>
                            <th>Loại xe</th>
                            <th>Giá vé</th>
                            <th>Ghế trống</th>
                            <th>Trạng thái</th>
                            <th class="text-end pe-3">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${trips}">
                            <td class="ps-3 font-monospace fw-bold text-primary" th:text="${t.tripCode}">TRP-001</td>
                            <td>
                                <div class="fw-bold" th:text="${t.departureProvince + ' → ' + t.arrivalProvince}"></div>
                                <small class="text-muted" th:text="${t.departureStation + ' → ' + t.arrivalStation}"></small>
                            </td>
                            <td th:text="${t.busCompany.companyName}"></td>
                            <td th:text="${#temporals.format(t.departureTime, 'HH:mm dd/MM/yyyy')}"></td>
                            <td th:text="${#temporals.format(t.arrivalTime, 'HH:mm dd/MM/yyyy')}"></td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${t.busType.displayName}"></span>
                            </td>
                            <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(t.ticketPrice, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${t.availableSeats > 5 ? 'bg-success-subtle text-success' : (t.availableSeats > 0 ? 'bg-warning-subtle text-warning' : 'bg-danger-subtle text-danger')}"
                                      th:text="${t.availableSeats + '/' + t.totalSeats}">
                                </span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${t.status.name() == 'SCHEDULED' ? 'bg-info text-dark' : (t.status.name() == 'IN_PROGRESS' ? 'bg-primary' : (t.status.name() == 'COMPLETED' ? 'bg-success' : 'bg-secondary'))}"
                                      th:text="${t.status.displayName}">
                                </span>
                            </td>
                            <td class="text-end pe-3">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/booking/trip/{id}/seats(id=${t.id})}" class="btn btn-sm btn-outline-info" title="Xem sơ đồ ghế">
                                        <i class="bi bi-grid-3x3"></i>
                                    </a>
                                    <a th:href="@{/admin/trips/{id}/edit(id=${t.id})}" class="btn btn-sm btn-outline-primary" title="Sửa chuyến">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:if="${t.status.name() != 'CANCELLED'}"
                                          th:action="@{/admin/trips/{id}/cancel(id=${t.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-warning"
                                                data-confirm="Bạn có chắc chắn muốn hủy chuyến xe này? Dữ liệu vé của khách sẽ được giữ nguyên."
                                                title="Hủy chuyến">
                                            <i class="bi bi-slash-circle"></i>
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/trips/{id}/delete(id=${t.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                data-confirm="Xóa chuyến xe? (Nếu đã có khách đặt vé, hệ thống sẽ tự chuyển sang Hủy chuyến)."
                                                title="Xóa chuyến">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="~{shared/fragments :: footer}"></footer>
</body>
</html>
