<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{common/fragments :: head('Hồ sơ Đối tác Nhà Xe - Admin')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{common/fragments :: navbar}"></nav>

<div class="container-fluid flex-grow-1">
    <div class="row">
        <div class="col-lg-2 px-0">
            <aside th:replace="~{common/fragments :: adminSidebar('companies')}"></aside>
        </div>

        <main class="col-lg-10 py-4 px-4">
            <div th:replace="~{common/fragments :: alerts}"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-buildings-fill text-primary me-2"></i>Quản lý Đối tác Nhà Xe &amp; Đội xe</h3>
                    <p class="text-muted mb-0">Tra cứu nhà xe, theo dõi số lượng chuyến đang vận hành và kiểm soát trạng thái hợp tác</p>
                </div>
                <a th:href="@{/admin/companies}" class="btn btn-outline-primary">
                    <i class="bi bi-plus-square me-1"></i>Thêm / Chỉnh sửa Nhà xe
                </a>
            </div>

            <!-- Thống kê tổng quan nhà xe -->
            <div class="row g-3 mb-4" th:if="${overviewStats != null}">
                <div class="col-md-3 col-6">
                    <div class="admin-section-card p-3">
                        <div class="small text-muted">Tổng nhà xe</div>
                        <div class="fs-4 fw-bold text-dark" th:text="${overviewStats.totalCompanies}">0</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="admin-section-card p-3">
                        <div class="small text-muted">Đang hoạt động</div>
                        <div class="fs-4 fw-bold text-success" th:text="${overviewStats.activeCompanies}">0</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="admin-section-card p-3">
                        <div class="small text-muted">Tạm ngưng</div>
                        <div class="fs-4 fw-bold text-secondary" th:text="${overviewStats.inactiveCompanies}">0</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="admin-section-card p-3">
                        <div class="small text-muted">Đánh giá trung bình</div>
                        <div class="fs-4 fw-bold text-warning"
                             th:text="${#numbers.formatDecimal(overviewStats.averageRating, 1, 'POINT', 1, 'POINT') + ' ★'}">4.8 ★</div>
                    </div>
                </div>
            </div>

            <!-- Thanh tìm kiếm nhà xe -->
            <div class="admin-section-card p-3 mb-4">
                <form th:action="@{/admin/companies/manage}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-9">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm nhà xe theo tên, số hotline hoặc trụ sở...">
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">Tìm kiếm</button>
                        <a th:href="@{/admin/companies/manage}" class="btn btn-outline-secondary">Tất cả</a>
                    </div>
                </form>
            </div>

            <div class="row g-4">
                <div class="col-md-6 col-xl-4" th:each="c : ${companies}">
                    <div class="admin-section-card p-4 h-100 d-flex flex-column justify-content-between company-profile-card">
                        <div>
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <span class="company-rating-badge" th:text="${c.formattedRating}">4.8 ★</span>
                                <span class="badge" th:classappend="${c.active ? 'bg-success' : 'bg-secondary'}" th:text="${c.statusLabel}"></span>
                            </div>
                            <h5 class="fw-bold mb-1" th:text="${c.name}">Phương Trang</h5>
                            <p class="small text-primary fw-semibold mb-2">
                                <i class="bi bi-telephone-fill me-1"></i><span th:text="${c.hotline}">1900 6067</span>
                            </p>
                            <p class="small text-secondary mb-2" th:text="${c.headquarters}"></p>
                            <p class="small text-muted mb-3" th:text="${c.description}"></p>
                        </div>
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <span class="badge bg-primary-subtle text-primary">
                                <i class="bi bi-bus-front me-1"></i>
                                <span th:text="${(tripCountMap[c.id] != null ? tripCountMap[c.id] : 0) + ' chuyến'}">0 chuyến</span>
                            </span>
                            <div class="d-flex gap-1">
                                <a th:href="@{/admin/companies/edit/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                                <form th:action="@{/admin/companies/{id}/toggle(id=${c.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-warning"
                                            th:text="${c.active ? 'Tạm ngưng' : 'Mở lại'}"></button>
                                </form>
                                <form th:action="@{/admin/companies/{id}/delete(id=${c.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa nếu chưa có chuyến">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="~{common/fragments :: footer}"></footer>
<div th:replace="~{common/fragments :: scripts(null)}"></div>
</body>
</html>
