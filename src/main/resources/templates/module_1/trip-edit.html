<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{common/fragments :: head('Điều chỉnh Chuyến Xe ' + ${trip.tripCode})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{common/fragments :: navbar}"></nav>

<div class="container-fluid flex-grow-1">
    <div class="row">
        <div class="col-lg-2 px-0">
            <aside th:replace="~{common/fragments :: adminSidebar('trips')}"></aside>
        </div>

        <main class="col-lg-10 py-4 px-4">
            <div th:replace="~{common/fragments :: alerts}"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <span class="trip-code-pill mb-1 d-inline-block" th:text="${trip.tripCode}">TRP-001</span>
                    <h3 class="fw-bold mb-1">Cập nhật Chi tiết Chuyến Xe</h3>
                    <p class="text-muted mb-0" th:text="${trip.departureProvince + ' → ' + trip.arrivalProvince}"></p>
                </div>
                <div class="d-flex gap-2">
                    <form th:action="@{/admin/trips/{id}/duplicate(id=${trip.id})}" method="post">
                        <button type="submit" class="btn btn-outline-success">
                            <i class="bi bi-copy me-1"></i>Nhân bản sang ngày mai
                        </button>
                    </form>
                    <a th:href="@{/admin/trips/board}" class="btn btn-outline-secondary">Quay lại</a>
                </div>
            </div>

            <div class="alert alert-warning small" th:if="${trip.totalSeats - trip.availableSeats > 0}">
                <i class="bi bi-shield-exclamation me-1"></i>
                Chuyến xe này đã có <strong th:text="${trip.totalSeats - trip.availableSeats}">0</strong> ghế đang giữ hoặc đã đặt; hệ thống tự động khóa việc thay đổi loại sơ đồ ghế để bảo toàn vị trí khách đã chọn.
            </div>

            <div class="admin-section-card p-4">
                <form th:action="@{/admin/trips/save}" th:object="${tripForm}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nhà xe vận hành *</label>
                            <select th:field="*{companyId}" class="form-select" required>
                                <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Loại xe *</label>
                            <select th:field="*{busType}" id="busTypeSelect" class="form-select" required>
                                <option th:each="bt : ${busTypes}" th:value="${bt}" th:text="${bt.displayName}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Trạng thái chuyến</label>
                            <select th:field="*{status}" class="form-select">
                                <option th:each="s : ${tripStatuses}" th:value="${s}" th:text="${s.displayName}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Tỉnh / Thành đi *</label>
                            <input type="text" th:field="*{departureProvince}" id="depProvinceInput" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Tỉnh / Thành đến *</label>
                            <input type="text" th:field="*{arrivalProvince}" id="arrProvinceInput" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Biển số xe *</label>
                            <input type="text" th:field="*{licensePlate}" id="licensePlateInput" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Bến đón *</label>
                            <input type="text" th:field="*{departureStation}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Bến trả *</label>
                            <input type="text" th:field="*{arrivalStation}" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Giờ khởi hành *</label>
                            <input type="datetime-local" th:field="*{departureTime}" id="departureTimeInput" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Giờ dự kiến đến *</label>
                            <input type="datetime-local" th:field="*{arrivalTime}" id="arrivalTimeInput" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Giá vé niêm yết (VNĐ) *</label>
                            <input type="number" step="5000" min="10000" th:field="*{ticketPrice}" id="ticketPriceInput" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Tiện ích chuyến xe</label>
                            <textarea th:field="*{amenities}" class="form-control" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a th:href="@{/admin/trips}" class="btn btn-outline-secondary">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-save me-1"></i>Lưu Cập nhật Chuyến Xe
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<footer th:replace="~{common/fragments :: footer}"></footer>
<div th:replace="~{common/fragments :: scripts('/js/module_1/trip-form.js')}"></div>
</body>
</html>
