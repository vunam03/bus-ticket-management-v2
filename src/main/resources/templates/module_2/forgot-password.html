<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{common/fragments :: head('Khôi phục mật khẩu')}"></head>
<body>
<nav th:replace="~{common/fragments :: navbar}"></nav>

<main class="container py-4">
    <div class="auth-card bg-white">
        <div class="auth-header text-center">
            <h4 class="fw-bold mb-1"><i class="bi bi-key-fill text-warning me-2"></i>Quên Mật Khẩu</h4>
            <p class="small mb-0 opacity-75">Nhận mã xác thực khôi phục mật khẩu tài khoản</p>
        </div>

        <div class="p-4">
            <div th:replace="~{common/fragments :: alerts}"></div>

            <!-- Bước 1: Yêu cầu mã khôi phục -->
            <form th:if="${generatedToken == null}" th:action="@{/auth/forgot-password}" method="post" class="row g-3">
                <div class="col-12">
                    <label class="form-label fw-semibold">Nhập Email đã đăng ký tài khoản</label>
                    <input type="email" name="email" class="form-control" placeholder="email@example.com" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100 fw-bold">
                        <i class="bi bi-send me-1"></i>Lấy Mã Khôi Phục
                    </button>
                </div>
            </form>

            <!-- Bước 2: Đặt lại mật khẩu với mã Token -->
            <form th:if="${generatedToken != null}" th:action="@{/auth/reset-password}" method="post" class="row g-3 mt-1">
                <div class="col-12">
                    <label class="form-label fw-semibold">Mã khôi phục (Token)</label>
                    <input type="text" name="token" th:value="${generatedToken}" class="form-control fw-bold font-monospace" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Mật khẩu mới</label>
                    <input type="password" name="newPassword" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success w-100 fw-bold">
                        <i class="bi bi-check2-circle me-1"></i>Đặt Lại Mật Khẩu
                    </button>
                </div>
            </form>

            <div class="text-center mt-3 small">
                <a th:href="@{/auth/login}" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Quay lại trang đăng nhập</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{common/fragments :: footer}"></footer>
</body>
</html>
