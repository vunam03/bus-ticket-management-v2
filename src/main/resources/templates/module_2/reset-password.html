<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{common/fragments :: head('Đặt lại mật khẩu')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{common/fragments :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div class="auth-card bg-white">
        <div class="auth-header text-center">
            <h4 class="fw-bold mb-1"><i class="bi bi-shield-lock-fill text-warning me-2"></i>Đặt Lại Mật Khẩu Mới</h4>
            <p class="small mb-0 opacity-75">Nhập mã xác thực khôi phục và thiết lập mật khẩu an toàn mới</p>
        </div>

        <div class="p-4">
            <div th:replace="~{common/fragments :: alerts}"></div>

            <div th:if="${tokenValid}" class="alert alert-success small py-2 mb-3">
                <i class="bi bi-check-circle-fill me-1"></i>Mã khôi phục hợp lệ và đang còn thời hạn 30 phút.
            </div>

            <form th:action="@{/auth/reset-password}" method="post" class="row g-3">
                <div class="col-12">
                    <label class="form-label fw-semibold" for="resetToken">Mã khôi phục (Token) <span class="text-danger">*</span></label>
                    <input type="text" id="resetToken" name="token" th:value="${forgotForm.token}"
                           class="form-control fw-bold font-monospace text-uppercase" placeholder="VD: A1B2C3D4" required>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold" for="newPassword">Mật khẩu mới <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" id="newPassword" name="newPassword" class="form-control password-strength-target"
                               placeholder="Tối thiểu 6 ký tự" required>
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="newPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength-meter mt-2">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                    <small class="text-muted" id="passwordStrengthLabel">Độ mạnh mật khẩu: Chưa nhập</small>
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold" for="confirmPassword">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                               placeholder="Nhập lại mật khẩu mới" required>
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="confirmPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <small id="confirmMatchHint" class="form-text"></small>
                </div>

                <div class="col-12 pt-2">
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2">
                        <i class="bi bi-check2-circle me-1"></i>Xác Nhận Đặt Lại Mật Khẩu
                    </button>
                </div>
            </form>

            <div class="d-flex justify-content-between mt-3 small">
                <a th:href="@{/auth/forgot-password}" class="text-decoration-none">Yêu cầu mã khác</a>
                <a th:href="@{/auth/login}" class="text-decoration-none">Về trang đăng nhập</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{common/fragments :: footer}"></footer>
<div th:replace="~{common/fragments :: scripts('/js/module_2/auth.js')}"></div>
</body>
</html>
